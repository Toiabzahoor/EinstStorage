<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EinstStorage, Store Files In Midi!</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #181b24;
            --border: #2a2f3d;
            --accent: #7c5cff;
            --accent-hover: #9175ff;
            --text: #e8eaf0;
            --muted: #8b93a7;
            --ok: #3ddc97;
            --err: #ff5c77;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.9rem;
        }

        .subtitle {
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 1.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            color: var(--muted);
        }

        .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(124, 92, 255, 0.08);
            color: var(--text);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.9rem;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.55rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .meta {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--muted);
            word-break: break-all;
        }

        .hash {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.78rem;
            background: #101218;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            margin-top: 0.35rem;
            color: var(--ok);
        }

        .error {
            color: var(--err);
            margin-top: 0.75rem;
            font-size: 0.9rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--muted);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>EinstStorage</h1>
        <p class="subtitle">
            Turn any file into a playable C-major pentatonic <code>.mid</code> song (1 byte = 1 note) and decode it back
            with an identical SHA-256 hash.
        </p>

        <div class="grid">
            <!-- ENCODE -->
            <div class="card">
                <h2>1. File → MIDI</h2>
                <div id="encodeDrop" class="dropzone">
                    Drop any file here, or click to choose
                    <input id="encodeInput" type="file" hidden />
                </div>

                <div class="row">
                    <label>
                        <input id="gzipToggle" type="checkbox" checked />
                        Compress with Gzip first
                    </label>
                </div>

                <div class="row">
                    <button id="downloadMidiBtn" disabled>Download .mid</button>
                    <button id="play
